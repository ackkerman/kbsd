name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run typecheck && npm test && npm run build && npm run test:sites
  native:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s native/Tests/SigningTests
      - run: swift test --package-path native
      - run: bash native/scripts/package-app.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Format, build, test and diagnose all recordings
        shell: pwsh
        run: ./windows/scripts/check.ps1
      - name: Build self-contained ZIP
        shell: pwsh
        run: ./windows/scripts/package.ps1
      - name: Build per-user installer
        shell: pwsh
        run: ./windows/scripts/installer.ps1
      - name: Verify install, activation and uninstall
        shell: pwsh
        run: ./windows/scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kbsd-windows-x64
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
            dist/windows/SHA256SUMS.txt
            dist/windows/SHA256SUMS-setup.txt
